name: Lighthouse

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit production URL
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://vinicius-calegari.github.io/AtmosIQ/
          uploadArtifacts: true
          temporaryPublicStorage: false
